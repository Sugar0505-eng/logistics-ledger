workflows:
  android-build:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: 拉取锁定依赖
        script: flutter pub get --enforce-lockfile
      - name: 检查格式
        script: dart format --output=none --set-exit-if-changed lib test
      - name: 静态分析
        script: flutter analyze
      - name: 运行测试
        script: flutter test
      - name: 构建 Release APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

  ios-build:
    name: iOS（仅编译，不签名）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 拉取锁定依赖
        script: flutter pub get --enforce-lockfile
      - name: 检查格式
        script: dart format --output=none --set-exit-if-changed lib test
      - name: 静态分析
        script: flutter analyze
      - name: 运行测试
        script: flutter test
      - name: 构建 iOS（不签名）
        script: flutter build ios --release --no-codesign
      - name: 打包未签名产物
        script: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -n "$APP" ]; then
            mkdir -p build/ios/unsigned/Payload
            cp -r "$APP" build/ios/unsigned/Payload/
            cd build/ios/unsigned && zip -qr app-unsigned.ipa Payload
          fi
    artifacts:
      - build/ios/unsigned/*.ipa

  ios-testflight:
    name: iOS 上传 TestFlight（需 Apple 账号 + 签名）
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: APP_STORE_CONNECT_KEY
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sugar0505.logisticsledger
    scripts:
      - name: 应用签名描述文件
        script: xcode-project use-profiles
      - name: 拉取锁定依赖
        script: flutter pub get --enforce-lockfile
      - name: 检查格式
        script: dart format --output=none --set-exit-if-changed lib test
      - name: 静态分析
        script: flutter analyze
      - name: 运行测试
        script: flutter test
      - name: 构建签名 IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
